name: olimpo_ai
description: OlimpoAI - Mobile App with 10 Local AI Titans (100% Offline, GGUF/ONNX/BIN Models)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  file_picker: ^6.1.1
  flutter_markdown: ^0.6.14
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  share_plus: ^7.2.1
  http: ^1.1.0
  path_provider: ^2.1.1
  uuid: ^4.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
